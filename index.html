<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04101f">
<title>Оптические волокна</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-v2-192.png">
<link rel="apple-touch-icon" href="icon-v2-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache">
<style>
:root{
  --bg:radial-gradient(120% 80% at 50% 0%,#0b2546 0%,#04101f 55%,#020a15 100%);
  --panel:linear-gradient(180deg,rgba(14,40,76,.92),rgba(8,26,52,.92));
  --panel-b:#1c4a82;
  --inner:linear-gradient(180deg,#0a1c37,#071429);
  --text:#ffffff; --muted:#c9dbf3; --title:#ffffff;
  --btn:linear-gradient(180deg,#123766,#0b2547); --btn-b:#24538d; --btn-t:#e9f2ff;
  --acc:linear-gradient(180deg,#6b8fb8,#466c96); --acc-glow:0 3px 10px rgba(0,0,0,.35);
  --info:linear-gradient(180deg,#d6e4f5,#b9cde6); --info-t:#13243d;
  --cb:linear-gradient(180deg,#eef5ff 0%,#c6d8ee 100%); --cb-b:#e9f2ff;
  --cb-sh:0 4px 0 #6f8bb0,0 6px 14px rgba(0,0,0,.45),inset 0 1px 0 #fff; --cb-sh-a:0 1px 0 #6f8bb0,0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 #fff;
  --row:linear-gradient(180deg,#a9bad0 0%,#7b90ad 100%); --row-t:#0f1e35;
  --on:linear-gradient(180deg,#0e4a8f,#0a3266); --on-b:#43c6ff; --on-t:#fff; --on-glow:0 0 14px rgba(60,190,255,.85),inset 0 0 10px rgba(60,190,255,.35);
  --arr:#ffffff; --shade:rgba(3,10,22,.8);
  --res:linear-gradient(180deg,#0a2036,#06172a); --res-b:#2fe0a8; --res-glow:0 0 18px rgba(47,224,168,.45);
  --res-label:#3fe6b2; --res-num:#ffffff; --res-big:#ffd51a; --sep:rgba(255,255,255,.18);
}
html.light{
  --bg:linear-gradient(180deg,#f4f8fd,#e8f0fa);
  --panel:linear-gradient(180deg,#f7faff,#edf3fb);
  --panel-b:#d3e0f0;
  --inner:linear-gradient(180deg,#dfe9f6,#cfdcee);
  --text:#0d2342; --muted:#33507a; --title:#0d2342;
  --btn:linear-gradient(180deg,#ffffff,#eaf1fa); --btn-b:#d5e1ef; --btn-t:#0d2342;
  --acc:linear-gradient(180deg,#6b8fb8,#466c96); --acc-glow:0 3px 8px rgba(20,30,50,.25);
  --info:linear-gradient(180deg,#eef5fd,#e2ecf8); --info-t:#0d2342;
  --cb:linear-gradient(180deg,#ffffff 0%,#e4edf8 100%); --cb-b:#d0dcec;
  --cb-sh:0 4px 0 #b8c9df,0 6px 14px rgba(13,35,66,.18),inset 0 1px 0 #fff; --cb-sh-a:0 1px 0 #b8c9df,0 2px 5px rgba(13,35,66,.15),inset 0 1px 0 #fff;
  --row:linear-gradient(180deg,#f1f6fc 0%,#e1eaf5 100%); --row-t:#0d2342;
  --on:linear-gradient(180deg,#d4ecff,#bfe1ff); --on-b:#1a8cff; --on-t:#0a2448; --on-glow:0 0 10px rgba(26,140,255,.45);
  --arr:#0d2342; --shade:rgba(196,212,232,.8);
  --res:linear-gradient(180deg,#ffffff,#f2f7fd); --res-b:#d5e1ef; --res-glow:0 4px 18px rgba(20,60,120,.12);
  --res-label:#1663d6; --res-num:#0d3f8f; --res-big:#0d3f8f; --sep:rgba(13,35,66,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#04101f}
html.light,html.light body{background:#eef4fb}
body{background:var(--bg);background-attachment:fixed;color:var(--text);
  font-family:"Segoe UI",Roboto,"Noto Sans","Noto Sans Hebrew",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
.app{width:min(100vw,480px);margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(6px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;direction:ltr;
  overscroll-behavior-x:contain;margin:0 -8px;-webkit-overflow-scrolling:touch}
.pages::-webkit-scrollbar{display:none}
#tbl,#loss{flex:0 0 100%;width:100%;min-width:0;min-height:0;display:flex;flex-direction:column;scroll-snap-align:start;scroll-snap-stop:always;padding:0 8px}
html[dir=rtl] #tbl,html[dir=rtl] #loss{direction:rtl}
#tbl .panel{flex:1;min-height:0;display:flex;flex-direction:column}


/* header */
.hdr{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;flex:none}
.logo{width:34px;height:34px;flex:none;cursor:pointer}
.ver{font-size:11px;font-weight:700;opacity:.45;margin-inline-start:6px;vertical-align:super}
.title{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:clamp(16px,4.6vw,25px);font-weight:800;color:var(--title);white-space:nowrap;letter-spacing:.2px}
.lang{display:flex;border-radius:12px;padding:3px;background:var(--btn);border:1px solid var(--btn-b);flex:none}
.lang button{border:0;background:transparent;color:var(--btn-t);font:700 clamp(12px,3.4vw,14px)/1 inherit;padding:6px 8px;border-radius:9px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--acc);color:#fff;box-shadow:var(--acc-glow)}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;background:var(--btn);border:1px solid var(--btn-b);margin-bottom:7px;overflow:hidden;flex:none}
.tabs button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:var(--btn-t);
  font:700 clamp(13px,3.8vw,16px)/1 inherit;font-family:inherit;padding:7px 6px;border-radius:13px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;box-shadow:var(--acc-glow)}
.tabs svg{width:20px;height:20px;flex:none}

/* panel */
.panel{background:var(--panel);border:1px solid var(--panel-b);border-radius:18px;padding:8px 8px 8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.ptitle{font-size:clamp(16px,4.6vw,20px);font-weight:800;margin:0 4px 6px;flex:none}
.struct{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px;flex:none}
.struct button{border:1px solid var(--btn-b);background:var(--btn);color:var(--btn-t);border-radius:10px;padding:3px 2px;cursor:pointer;font-family:inherit;line-height:1.1}
.struct b{display:block;font-size:clamp(12px,3.4vw,14.5px)}
.struct span{font-size:clamp(10.5px,3vw,12.5px);opacity:.85}
.struct button.on{background:var(--acc);color:#fff;border-color:#8fb0d4;box-shadow:var(--acc-glow)}

.info{flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,#6b8fb8 0%,#466c96 100%);color:#fff;border-radius:14px;
  width:76%;align-self:center;padding:4px 12px;margin-bottom:9px;border:1px solid #8fb0d4;
  box-shadow:0 5px 0 #2d4b6d,0 8px 14px rgba(20,30,50,.3),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .08s,box-shadow .08s;cursor:pointer}
.info:active{transform:translateY(4px);box-shadow:0 1px 0 #2d4b6d,0 3px 6px rgba(20,30,50,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.info .ic{flex:none;width:22px;height:22px;opacity:.95}
.info .txt{font-weight:800;font-size:clamp(17px,5vw,21px);letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.info .chev{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.95);color:#466c96;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.info .chev svg{width:14px;height:14px}
.info b{font-weight:800}
.info i{font-style:normal;opacity:.45;margin:0 4px}
.info select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}

/* wheels */
.wheels{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.14fr) minmax(0,1.14fr) minmax(0,.42fr);gap:4px}
.col{container-type:inline-size;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--panel-b);border-radius:14px;padding:0 2px 4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.chead{flex:none;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:min(19px,12cqi)}
.ic-tube{width:26px;height:26px;border-radius:50%;border:5px solid #1a8cff;box-shadow:0 0 10px rgba(40,170,255,.8);background:transparent;flex:none}
html:not(.light) .ic-tube{border-color:#29b6ff;background:#fff;box-shadow:0 0 0 2px #0a6cf0 inset,0 0 10px rgba(40,170,255,.9)}
.ic-fiber{width:34px;height:9px;border-radius:9px;background:#fff;flex:none}
html.light .ic-fiber{background:#0a3a7a}
.numIn{display:flex;align-items:center;justify-content:center;gap:3px;width:calc(100% - 4px);height:34px;border-radius:9px;cursor:pointer;
  border:1.5px solid #8fb0d4;background:var(--acc);color:#fff;box-shadow:0 3px 0 #2d4b6d;font-family:inherit;padding:0}
.numIn:active{transform:translateY(2px);box-shadow:0 1px 0 #2d4b6d}
.numIn .ic-no{border-color:#fff;font-size:min(14px,20cqi)}
.numIn svg{width:min(16px,22cqi);height:min(16px,22cqi);flex:none}
.ic-no{font-size:15px;font-weight:800;border:2px solid currentColor;border-radius:7px;padding:3px 4px;line-height:1}
.wheel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--inner);border-radius:13px;overflow:hidden;position:relative;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.6),inset 0 -3px 10px rgba(0,0,0,.55),inset 3px 0 6px rgba(0,0,0,.35),inset -3px 0 6px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.08)}
html.light .wheel{box-shadow:inset 0 3px 8px rgba(13,35,66,.25),inset 0 -3px 8px rgba(13,35,66,.22),inset 3px 0 5px rgba(13,35,66,.12),inset -3px 0 5px rgba(13,35,66,.12),0 1px 0 #fff}
.vp::before,.vp::after{content:"";position:absolute;left:0;right:0;height:30%;pointer-events:none;z-index:5}
.vp::before{top:0;background:linear-gradient(180deg,var(--shade) 0%,transparent 100%)}
.vp::after{bottom:0;background:linear-gradient(0deg,var(--shade) 0%,transparent 100%)}
.arr{display:flex;align-items:center;justify-content:center;width:100%;height:22px;flex:none;border:0;background:transparent;cursor:pointer;color:var(--arr);padding:0}
.arr svg{width:24px;height:16px}
.vp{position:relative;flex:1;min-height:0;touch-action:pan-x;cursor:grab;overflow:hidden;perspective:520px;perspective-origin:50% 50%}
.vp:active{cursor:grabbing}
.row{position:absolute;left:2px;right:2px;top:calc(50% - var(--rh,44px)/2);height:var(--rh,44px);overflow:hidden;border-radius:7px;background:var(--row);color:var(--row-t);
  display:grid;grid-template-columns:auto 16px minmax(0,1fr);align-items:center;gap:4px;padding:0 4px;will-change:transform,opacity;border:2px solid transparent;
  backface-visibility:hidden;box-shadow:0 3px 5px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12)}
html.light .row{box-shadow:0 2px 4px rgba(13,35,66,.18),inset 0 1px 0 #fff,inset 0 -2px 0 rgba(13,35,66,.06)}
.row .n{font-weight:800;font-size:min(23px,13cqi,calc(var(--rh,44px)*.52));min-width:.9em;text-align:center}
.row .nm{font-weight:400;font-size:var(--nmfs,min(18px,11cqi,calc(var(--rh,44px)*.4)));white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:-.3px}
.row.num{display:flex;justify-content:center;padding:0}
.row.num .n{font-size:min(32px,36cqi,calc(var(--rh,44px)*.66))}
.row.on{background:var(--on);color:var(--on-t);border-color:var(--on-b);box-shadow:var(--on-glow);left:1px;right:1px;z-index:6}
.row.on .nm{font-weight:500}
.row.on .n{font-size:min(25px,14.5cqi,calc(var(--rh,44px)*.58))}
.row.num.on .n{font-size:min(36px,40cqi,calc(var(--rh,44px)*.72))}
.sw{width:16px;height:16px;border-radius:5px;position:relative;overflow:hidden;
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.25),inset 0 3px 4px rgba(255,255,255,.45),0 0 0 1px rgba(0,0,0,.15)}
.sw.mark::after{content:"";position:absolute;left:0;right:0;top:40%;height:22%;background:#111}
.sw.mark.blk::after{background:#fff}

/* result */
.res{flex:none;margin-top:7px;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.15fr) minmax(0,.85fr);align-items:center;background:var(--res);border:2px solid var(--res-b);
  border-radius:16px;padding:8px 4px;box-shadow:var(--res-glow)}
.res .lbl{font-weight:800;color:var(--res-label);font-size:clamp(12px,3.6vw,18px);padding:0 5px 0 4px;white-space:nowrap}
.res .cell{container-type:inline-size;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;border-inline-start:1.5px solid var(--sep);padding:2px 3px}
.res .ch{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:min(15px,14cqi);white-space:nowrap;max-width:100%;overflow:hidden}
.res .ch>span:last-child{min-width:0;overflow:hidden}
.res .ch .ic-tube{width:15px;height:15px;border-width:3px;box-shadow:none!important}
.res .ch .ic-fiber{width:18px;height:6px}
.res .ch .numIn{display:flex;align-items:center;justify-content:center;gap:3px;width:calc(100% - 4px);height:34px;border-radius:9px;cursor:pointer;
  border:1.5px solid #8fb0d4;background:var(--acc);color:#fff;box-shadow:0 3px 0 #2d4b6d;font-family:inherit;padding:0}
.numIn:active{transform:translateY(2px);box-shadow:0 1px 0 #2d4b6d}
.numIn .ic-no{border-color:#fff;font-size:min(14px,20cqi)}
.numIn svg{width:min(16px,22cqi);height:min(16px,22cqi);flex:none}
.ic-no{font-size:12px;padding:2px 3px}
.res .cv{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:min(34px,24cqi);max-width:100%;color:var(--res-num);line-height:1}
.ring{width:min(32px,24cqi);height:min(32px,24cqi);border-radius:50%;border:min(6px,4.5cqi) solid;flex:none;background:transparent}
html.light .ring{background:#fff}
.pill{flex:none;width:min(54px,36cqi);height:17px;border-radius:12px;border:2px solid rgba(160,170,185,.9);box-shadow:inset 0 -2px 3px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.5)}
.big{font-size:min(44px,34cqi)!important;color:var(--res-big)!important;text-shadow:0 0 14px rgba(255,213,26,.25)}
html.light .big{text-shadow:none}

/* loss tab */
#loss .panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;overflow:auto;padding:8px}
.node{display:flex;align-items:center;gap:9px;background:var(--btn);border:1px solid var(--btn-b);border-radius:14px;padding:7px 9px;flex:none}
.node.col2{flex-direction:column;align-items:stretch;gap:6px}
.nrow{display:flex;align-items:center;gap:9px}
.nic{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--inner);box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
html.light .nic{box-shadow:inset 0 2px 4px rgba(13,35,66,.18)}
.nic svg{width:30px;height:30px}
.nt{flex:1;min-width:0;font-weight:800;font-size:clamp(14px,4vw,16px)}
.nt small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.val{flex:none;min-width:86px;height:36px;padding:0 10px;border-radius:10px;border:1.5px solid var(--btn-b);background:var(--panel);color:var(--btn-t);
  font-family:inherit;font-weight:800;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;direction:ltr}
.val u{text-decoration:none;font-size:11px;font-weight:700;opacity:.6}
.val.anchor{border-color:#6b8fb8;box-shadow:0 0 0 2px rgba(107,143,184,.45);background:var(--on)}
.loss{flex:none;font-weight:800;font-size:15px;color:#e0564c;white-space:nowrap;direction:ltr} html:not(.light) .loss{color:#ff8a80}
.io{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.io .lab{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:2px}
.io .val{width:100%}
.io .mid{text-align:center}
.link{flex:none;height:12px;display:flex;justify-content:center}
.link::before{content:"";width:4px;background:linear-gradient(180deg,#f5a623,#f8d34a)}
.link.lk{position:relative;height:14px;z-index:3}
.pair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--btn-b);
  background:var(--btn);color:var(--muted);font-family:inherit;font-weight:800;font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.pair.on{background:var(--acc);color:#fff;border-color:#8fb0d4}
.pair svg{width:14px;height:14px}
.pair.warn{background:linear-gradient(180deg,#e8736f,#c94a45);color:#fff;border-color:#f0a19d}
.chips{display:flex;gap:4px}
.chips button{flex:1;border:1px solid var(--btn-b);background:var(--panel);color:var(--btn-t);border-radius:9px;height:30px;padding:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(12.5px,3.6vw,14.5px)}
.chips button.on{background:var(--acc);color:#fff;border-color:#8fb0d4;box-shadow:var(--acc-glow)}
.ddbtn{position:relative;align-self:center;width:62%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,#6b8fb8 0%,#466c96 100%);color:#fff;border:1px solid #8fb0d4;border-radius:12px;height:36px;
  box-shadow:0 4px 0 #2d4b6d,0 6px 12px rgba(20,30,50,.3),inset 0 1px 0 rgba(255,255,255,.35);margin-bottom:4px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.ddbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #2d4b6d,0 2px 5px rgba(20,30,50,.3)}
.ddbtn b{font-weight:800;font-size:clamp(17px,5vw,20px);letter-spacing:.5px}
.ddbtn .chev{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:#466c96}
.ddbtn .chev svg{width:12px;height:12px}
.ddbtn select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.lres{flex:none;margin-top:auto;border-radius:16px;padding:8px 10px;border:2px solid;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:2px 6px}
.lres.ok{border-color:#2fbf71;background:linear-gradient(180deg,rgba(47,191,113,.16),rgba(47,191,113,.06))}
.lres.bad{border-color:#e5484d;background:linear-gradient(180deg,rgba(229,72,77,.18),rgba(229,72,77,.06))}
.lres .k{font-size:12px;font-weight:700;color:var(--muted)}
.lres .val{font-size:clamp(22px,6.6vw,28px);height:44px;width:100%}
.lres .thr{font-weight:800;font-size:clamp(22px,6.6vw,28px);direction:ltr}
.lres.ok .rx{color:#1fa760} .lres.bad .rx{color:#e5484d}
html:not(.light) .lres.ok .rx{color:#3fe08a} html:not(.light) .lres.bad .rx{color:#ff6b6b}
.lres .vs{font-size:22px;font-weight:800;color:var(--muted)}
.lres .st{grid-column:1/-1;font-weight:800;font-size:15px;margin-top:4px}
.lhint{flex:none;text-align:center;font-size:11.5px;color:var(--muted);margin-top:5px}
/* keypad */
.pad{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.pad .box{width:min(100vw,480px);background:var(--panel);border-top:1px solid var(--panel-b);border-radius:20px 20px 0 0;padding:12px 12px max(12px,env(safe-area-inset-bottom));background-color:#0d2546}
html.light .pad .box{background-color:#f4f8fd}
.pad .ttl{font-weight:800;font-size:15px;color:var(--muted);text-align:center}
.pad .disp{font-weight:800;font-size:38px;text-align:center;margin:4px 0 10px;direction:ltr;min-height:46px}
.pad .disp u{text-decoration:none;font-size:16px;opacity:.6;margin-left:6px}

<script>
/* ===== НАСТРОЙКИ ===== */
const COLORS = [
  {hex:'#1677ff', ru:['Синяя','Синее'],             he:'כחול'},
  {hex:'#ff9500', ru:['Оранжевая','Оранжевое'],     he:'כתום'},
  {hex:'#27c22f', ru:['Зелёная','Зелёное'],         he:'ירוק'},
  {hex:'#8a4a1e', ru:['Коричневая','Коричневое'],   he:'חום'},
  {hex:'#a3abb5', ru:['Серая','Серое'],             he:'אפור'},
  {hex:'#f4f6f9', ru:['Белая','Белое'],             he:'לבן'},
  {hex:'#e5202a', ru:['Красная','Красное'],         he:'אדום'},
  {hex:'#151515', ru:['Чёрная','Чёрное'],           he:'שחור'},
  {hex:'#ffd60a', ru:['Жёлтая','Жёлтое'],           he:'צהוב'},
  {hex:'#8a2cf5', ru:['Фиолетовая','Фиолетовое'],   he:'סגול'},
  {hex:'#ff4fb8', ru:['Розовая','Розовое'],         he:'ורוד'},
  {hex:'#26d0e4', ru:['Бирюзовая','Бирюзовое'],     he:'טורקיז'}
];
// Кабели: T – трубок, F – волокон в трубке
// Кабели: T – трубок, F – волокон в трубке
// 6 в трубке → до 72 волокон (1–12 трубок); 12 в трубке → до 288 (1–24 трубки); 24 в трубке → только 288
const CABLES = [];
for(let t=1;t<=12;t++) CABLES.push({id:`F${t*6}_${t}x6`,  T:t, F:6});
for(let t=1;t<=24;t++) CABLES.push({id:`F${t*12}_${t}x12`,T:t, F:12});
CABLES.push({id:'F288_12x24', T:12, F:24});
const cname = c => `F${c.T*c.F} ${c.F}x${c.T}`;   // подпись: F72 12x6 = 12 волокон × 6 трубок
const DEF_CABLE = {6:'F72_12x6', 12:'F144_12x12', 24:'F288_12x24'};
// Затухание — постоянные параметры
const OLT_POWER = 5;          // выход OLT, dBm  (поменять под ваше оборудование)
const ATT_KM    = 0.25;       // dB на 1 км
const THRESHOLD = -23.9;      // порог у клиента, dBm
const SPL_CLOSURE  = [['1x2',3.5],['1x4',7],['1x8',10.5],['1x16',14]];   // קלוז'ר
const SPL_BUILDING = [['1x4',7],['1x8',10.5],['1x16',14.5],['1x32',18]];   // 1x4 — значение взято как у 1x4 в муфте           // בניין

const I18N = {
  ru:{title:'Оптические волокна',tab1:'Таблица волокон',tab2:'Расчёт потерь',struct:'Структура кабеля',
      s6:'6 волокон',s12:'12 волокон',s24:'24 волокна',inTube:'в трубке',cable:'Кабель',tubes:'Трубок',total:'Всего волокон',
      tube:'Трубка',fiber:'Волокно',result:'Результат:',
      oltS:'Выход сигнала',thr:'Порог, dBm',len:'Расстояние',km:'км',spC:'Сплиттер в муфте',spB:'Сплиттер в здании',none:'Нет',
      in:'Вход',out:'Выход',lrx:'У клиента, dBm',lmar:'запас',need:'не хватает',ok:'✔ В норме',bad:'✖ Ниже порога',
      pCin:'Вход сплиттера в муфте',pCout:'Выход сплиттера в муфте',pBin:'Вход сплиттера в здании',pBout:'Сигнал у клиента',
      hint:'Нажмите на любое значение, чтобы ввести замер'},
  he:{title:'סיבים אופטיים',tab1:'טבלת סיבים',tab2:'חישוב הפסדים',struct:'מבנה הכבל',
      s6:'6 סיבים',s12:'12 סיבים',s24:'24 סיבים',inTube:'בצינורית',cable:'כבל',tubes:'צינוריות',total:'סה״כ סיבים',
      tube:'צינורית',fiber:'סיב',result:'תוצאה:',
      oltS:'יציאת אות',thr:'סף, dBm',len:'מרחק',km:'ק״מ',spC:'מפצל קלוז\'ר',spB:'מפצל בניין',none:'ללא',
      in:'כניסה',out:'יציאה',lrx:'אצל הלקוח, dBm',lmar:'מרווח',need:'חסר',ok:'✔ תקין',bad:'✖ מתחת לסף',
      pCin:'כניסה למפצל קלוז\'ר',pCout:'יציאה ממפצל קלוז\'ר',pBin:'כניסה למפצל בניין',pBout:'אות אצל הלקוח',
      hint:'לחץ על ערך כלשהו כדי להזין מדידה'}
};

/* ===== СОСТОЯНИЕ ===== */
const store = {get(k,d){try{const v=localStorage.getItem('fiber_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem('fiber_'+k,JSON.stringify(v))}catch(e){}}};
const S = {
  lang: store.get('lang','ru'),
  theme: store.get('theme', (window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'),
  cable: store.get('cable','F144_12x12'),
  t: store.get('t',2), f: store.get('f',11)
};
let C = CABLES.find(c=>c.id===S.cable) || CABLES.find(c=>c.id==='F144_12x12');
const mod = (a,n)=>((a%n)+n)%n;
const L = k => I18N[S.lang][k];

/* ===== КОЛЕСО ===== */
const ARR_UP = '<svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l8-8 8 8"/></svg>';
const ARR_DN = '<svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8 8-8"/></svg>';
let H = 49;                   // шаг строки, px (пересчитывается под экран)
let STEP = 0.36;              // угол между строками, рад
let R = H/STEP;               // радиус колеса
function layoutWheels(){
  const vp=document.querySelector('.vp'); if(!vp||!vp.clientHeight) return;
  H=Math.max(30,Math.min(innerWidth>=900?80:64,vp.clientHeight/4.7)); R=Math.max(H/0.36,vp.clientHeight/2*0.97); STEP=H/R;
  document.documentElement.style.setProperty('--rh',(H-5).toFixed(1)+'px');
  document.querySelectorAll('.vp').forEach(v=>v.style.perspective=(R*3.2).toFixed(0)+'px');
}

class Wheel{
  constructor(host,opt){
    this.count=opt.count; this.item=opt.item; this.cls=opt.cls||''; this.onChange=opt.onChange;
    this.pos=0; this.base=null; this.last=null; this.silent=false; this.raf=0;
    host.innerHTML=`<button class="arr up">${ARR_UP}</button><div class="vp"></div><button class="arr dn">${ARR_DN}</button>`;
    this.vp=host.querySelector('.vp');
    this.nodes=[];
    for(let i=0;i<11;i++){const d=document.createElement('div');d.className='row '+this.cls;this.vp.appendChild(d);this.nodes.push(d)}
    host.querySelector('.up').onclick=()=>this.step(-1);
    host.querySelector('.dn').onclick=()=>this.step(1);
    this.bind();
  }
  get value(){return mod(Math.round(this.pos),this.count)}
  setCount(c){this.count=c;this.base=null;this.last=null}
  refresh(){this.base=null;this.calcFont();this.draw()}
  calcFont(){ // один размер шрифта названий на всё колесо — по самому длинному названию
    if(!this.vp.clientWidth) return;
    let best=-1,len=-1;
    for(let i=0;i<this.count;i++){const t=document.createElement('div');t.innerHTML=this.item(i);const nm=t.querySelector('.nm');if(nm&&nm.textContent.length>len){len=nm.textContent.length;best=i}}
    if(best<0) return;
    const n=this.nodes[5], html=n.innerHTML, on=n.classList.contains('on');
    this.vp.style.removeProperty('--nmfs'); n.innerHTML=this.item(best); n.classList.remove('on'); n.querySelector('.nm')&&(n.querySelector('.nm').style.fontWeight='500');
    const nn=n.querySelector('.n'); if(nn) nn.textContent=String(this.count);   // самый широкий номер
    const el=n.querySelector('.nm'), fs=parseFloat(getComputedStyle(el).fontSize), r=el.clientWidth/el.scrollWidth;
    this.vp.style.setProperty('--nmfs',(r<1?fs*r*0.93:fs).toFixed(2)+'px');
    n.innerHTML=html; n.classList.toggle('on',on);
  }
  draw(){
    const base=Math.floor(this.pos), frac=this.pos-base, center=Math.round(this.pos);
    if(base!==this.base){
      this.base=base;
      this.nodes.forEach((n,i)=>{n.innerHTML=this.item(mod(base+i-5,this.count))});
      this.fitPending=true;
    }
    this.nodes.forEach((n,i)=>{
      const k=i-5-frac, a=k*STEP;                       // угол на цилиндре
      const y=R*Math.sin(a), c=Math.max(0,Math.cos(a));
      n.style.transform=`translateY(${y.toFixed(2)}px) scale(${(0.86+0.14*c).toFixed(3)},${c.toFixed(3)})`;
      n.style.filter=`brightness(${(0.55+0.45*c).toFixed(3)})`;
      n.style.opacity = Math.abs(a)>=1.5 ? 0 : 1;
      n.classList.toggle('on', base+i-5===center);
    });
    const v=this.value;
    if(v!==this.last){this.last=v; if(!this.silent&&this.onChange) this.onChange(v)}
  }
  stop(){cancelAnimationFrame(this.raf);this.raf=0}
  animateTo(target,silent,dur){
    this.stop(); this.silent=!!silent;
    const from=this.pos, dist=target-from;
    if(Math.abs(dist)<1e-4){this.pos=target;this.draw();this.silent=false;return}
    dur = dur || Math.min(420, 180+Math.abs(dist)*40);
    const t0=performance.now();
    const tick=now=>{
      const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      this.pos=from+dist*e; this.draw();
      if(p<1) this.raf=requestAnimationFrame(tick);
      else {this.raf=0; this.pos=target; this.draw(); this.silent=false; this.wTgt=null; this.normalize()}
    };
    this.raf=requestAnimationFrame(tick);
  }
  normalize(){ // держим pos в пределах 0..count, чтобы не копились большие числа
    const r=Math.round(this.pos), m=mod(r,this.count);
    if(r!==m){this.pos+= (m-r); this.base=null; this.draw()}
  }
  step(d){this.animateTo(Math.round(this.pos)+d,false,200)}
  setValue(v,animate=true){
    const cur=Math.round(this.pos); let d=mod(v-cur,this.count); if(d>this.count/2) d-=this.count;
    if(!animate){this.stop();this.silent=true;this.pos=cur+d;this.base=null;this.draw();this.silent=false;this.normalize();return}
    if(d===0 && Math.abs(this.pos-cur)<1e-4) return;
    this.animateTo(cur+d,true);
  }
  bind(){
    const vp=this.vp; let drag=null;
    vp.addEventListener('pointerdown',e=>{
      this.stop(); this.silent=false; this.wTgt=null; vp.setPointerCapture(e.pointerId);
      drag={y0:e.clientY,p0:this.pos,moved:false,s:[{t:performance.now(),y:e.clientY}]};
    });
    vp.addEventListener('pointermove',e=>{
      if(!drag) return;
      const dy=e.clientY-drag.y0; if(Math.abs(dy)>4) drag.moved=true;
      this.pos=drag.p0-dy/H; this.draw();
      drag.s.push({t:performance.now(),y:e.clientY}); if(drag.s.length>6) drag.s.shift();
    });
    const end=e=>{
      if(!drag) return;
      if(!drag.moved){ // тап по строке
        const r=vp.getBoundingClientRect(), dy=Math.max(-R,Math.min(R,e.clientY-(r.top+r.height/2))), k=Math.round(Math.asin(dy/R)/STEP);
        this.animateTo(Math.round(this.pos)+k,false,220);
      } else {
        const a=drag.s[0], b=drag.s[drag.s.length-1], dt=Math.max(1,b.t-a.t);
        const v=(b.t-a.t)<160 ? -(b.y-a.y)/dt/H*1000 : 0; // строк/сек
        const target=Math.round(this.pos+v*0.22);
        this.animateTo(target,false,Math.min(700,260+Math.abs(v)*25));
      }
      drag=null;
    };
    vp.addEventListener('pointerup',end);
    // горизонтальный жест забирает прокрутка экранов (свайп) — просто ставим колесо на ближайшую строку
    vp.addEventListener('pointercancel',()=>{if(!drag) return; drag=null; this.animateTo(Math.round(this.pos),false,200)});
    // Колесо мыши: 1 щелчок = 1 строка, быстрая прокрутка разгоняет барабан (инерция)
    let lastW=0;
    vp.addEventListener('wheel',e=>{
      e.preventDefault();
      let d=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?300:1);
      const now=performance.now(), dt=now-lastW; lastW=now;
      const boost = dt<35?3 : dt<70?2 : dt<120?1.4 : 1;
      let steps=d/100*boost;
      if(Math.abs(d)>=50 && Math.abs(steps)<1) steps=Math.sign(steps);   // каждый щелчок — минимум 1 строка
      if(this.wTgt==null) this.wTgt=Math.round(this.pos);
      this.wTgt+=steps;
      const tgt=Math.round(this.wTgt);
      if(tgt!==Math.round(this.pos)||this.raf) this.animateTo(tgt,false,Math.min(650,260+Math.abs(tgt-this.pos)*35));
    },{passive:false});
  }
}

/* ===== УМЕНЬШЕНИЕ ТЕКСТА ПОД ШИРИНУ ===== */
function fitText(el){
  if(!el) return; el.style.fontSize='';
  const w=el.clientWidth; if(!w) return;
  if(el.scrollWidth>w){const fs=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=Math.max(8,fs*w/el.scrollWidth-0.2)+'px'}
}
window.addEventListener('resize',()=>{layoutWheels();[wT,wF,wN].forEach(w=>w.refresh());fitText(document.querySelector('.title'));fitText(document.querySelector('#info .txt'))});

/* ===== РЕНДЕР СТРОК ===== */
function swatch(ci,mark){const c=COLORS[ci];return `<span class="sw${mark?' mark':''}${mark&&ci===7?' blk':''}" style="background:${c.hex}"></span>`}
function colorName(ci,g){return S.lang==='ru'?COLORS[ci].ru[g]:COLORS[ci].he}
const itemTube = i => `<span class="n">${i+1}</span>${swatch(i%12, i>=12)}<span class="nm">${colorName(i%12,0)}</span>`;
const itemFiber= i => `<span class="n">${i+1}</span>${swatch(i%12, i>=12)}<span class="nm">${colorName(i%12,1)}</span>`;
const itemNum  = i => `<span class="n">${i+1}</span>`;

let wT,wF,wN;
function save(){store.set('cable',C.id);store.set('t',S.t);store.set('f',S.f)}
function updateResult(){
  document.getElementById('rT').textContent=S.t+1;
  document.getElementById('rF').textContent=S.f+1;
  document.getElementById('rN').textContent=S.t*C.F+S.f+1;
  const tc=COLORS[S.t%12].hex, fc=COLORS[S.f%12].hex;
  const ring=document.getElementById('rTc'); ring.style.borderColor=tc; ring.style.boxShadow=`0 0 12px ${tc}aa`;
  const pill=document.getElementById('rFc'); pill.style.background=fc;
  save();
}
function onTube(t){S.t=t; wN.setValue(S.t*C.F+S.f); updateResult()}
function onFiber(f){S.f=f; wN.setValue(S.t*C.F+S.f); updateResult()}
function onNum(n){S.t=Math.floor(n/C.F); S.f=n%C.F; wT.setValue(S.t); wF.setValue(S.f); updateResult()}

function renderStruct(){
  const el=document.getElementById('struct');
  el.innerHTML=[6,12,24].map(n=>`<button data-s="${n}" class="${C.F===n?'on':''}"><b>${L('s'+n)}</b><span>${L('inTube')}</span></button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=+b.dataset.s; if(n!==C.F) setCable(store.get('last'+n,DEF_CABLE[n]))});
}
function renderInfo(){
  const opts=CABLES.filter(c=>c.F===C.F).map(c=>`<option value="${c.id}" ${c.id===C.id?'selected':''}>${cname(c)}</option>`).join('');
  document.getElementById('info').innerHTML=
    `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="8" cy="10" r="2.2"/><circle cx="16" cy="10" r="2.2"/><circle cx="12" cy="16" r="2.2"/></svg>
     <span class="txt" dir="ltr">${cname(C)}</span>
     <span class="chev"><svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8 8-8"/></svg></span>
     <select id="cabSel">${opts}</select>`;
  document.getElementById('cabSel').onchange=e=>setCable(e.target.value);
  requestAnimationFrame(()=>fitText(document.querySelector('#info .txt')));
}
function setCable(id){
  C=CABLES.find(c=>c.id===id)||CABLES.find(c=>c.id===DEF_CABLE[12]); S.cable=C.id; store.set('last'+C.F,C.id);
  S.t=Math.min(S.t,C.T-1); S.f=Math.min(S.f,C.F-1);
  wT.setCount(C.T); wF.setCount(C.F); wN.setCount(C.T*C.F);
  wT.setValue(S.t,false); wF.setValue(S.f,false); wN.setValue(S.t*C.F+S.f,false);
  [wT,wF].forEach(w=>w.refresh());
  renderStruct(); renderInfo(); updateResult();
}

/* ===== ЯЗЫК / ТЕМА / ВКЛАДКИ ===== */
function applyLang(){
  document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==='he'?'rtl':'ltr';
  document.title=L('title');
  requestAnimationFrame(()=>fitText(document.querySelector('.title')));
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=L(e.dataset.t));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  renderStruct(); renderInfo(); [wT,wF].forEach(w=>w.refresh()); renderChips(); calcLoss(); store.set('lang',S.lang);
  requestAnimationFrame(()=>document.querySelectorAll('.res .ch>span:last-child').forEach(fitText));
}
function applyTheme(){
  document.documentElement.classList.toggle('light',S.theme==='light');
  document.querySelector('meta[name=theme-color]').content=S.theme==='light'?'#eef4fb':'#04101f';
  store.set('theme',S.theme);
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;applyLang()});
document.getElementById('logo').onclick=()=>{S.theme=S.theme==='light'?'dark':'light';applyTheme()};
const pagesEl=document.getElementById('pages');
function markTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t))}
function setTab(t,smooth=true){
  markTab(t);
  const x=t==='loss'?pagesEl.clientWidth:0;
  pagesEl.scrollTo({left:x,behavior:smooth?'smooth':'auto'});
}
pagesEl.addEventListener('scroll',()=>{markTab(pagesEl.scrollLeft>pagesEl.clientWidth/2?'loss':'tbl')},{passive:true});
window.addEventListener('resize',()=>{const t=document.querySelector('.tabs button.on');if(t)setTab(t.dataset.tab,false)});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

/* ===== РАСЧЁТ ПОТЕРЬ ===== */
// Точки: olt → (кабель) → cin → [муфта] → cout = вход здания → [здание] → bout = клиент
// Техник может задать значение в любой точке — остальные пересчитываются от неё.
const LS = {km:store.get('km',1), c:store.get('spc3',2), b:store.get('spb3',1),
            anchor:store.get('anc','olt'), aval:store.get('aval',OLT_POWER)};
const fmt = (v,d=1) => (v>0.0001?'+':v<-0.0001?'−':'')+Math.abs(v).toFixed(d);
function points(){
  const fib=LS.km*ATT_KM, lc=SPL_CLOSURE[LS.c][1], lb=SPL_BUILDING[LS.b][1];
  const off={olt:0, cin:-fib, cout:-fib-lc, bout:-fib-lc-lb};
  const olt=LS.aval-off[LS.anchor], P={};
  for(const k in off) P[k]=olt+off[k];
  return {P,fib,lc,lb};
}
function renderChips(){
  const CH='<span class="chev"><svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8 8-8"/></svg></span>';
  const mk=(id,arr,key)=>{const el=document.getElementById(id), cur=arr[LS[key]];
    el.innerHTML=`<b dir="ltr">${cur[0]}</b>${CH}<select>${arr.map((x,i)=>`<option value="${i}" ${LS[key]===i?'selected':''}>${x[0]+'   (−'+x[1]+' dB)'}</option>`).join('')}</select>`;
    el.querySelector('select').onchange=e=>{LS[key]=+e.target.value;autoPair(key);renderChips();calcLoss()};};
  mk('ddC',SPL_CLOSURE,'c'); mk('ddB',SPL_BUILDING,'b');
}
// GPON: общее деление всегда 1:64 (1x2↔1x32, 1x4↔1x16, 1x8↔1x8, 1x16↔1x4)
const ratio = n => parseInt(n.split('x')[1]);
function autoPair(changed){
  const [src,dst,key]=changed==='c'?[SPL_CLOSURE,SPL_BUILDING,'b']:[SPL_BUILDING,SPL_CLOSURE,'c'];
  const r=ratio(src[LS[changed]][0]);
  const j=dst.findIndex(x=>ratio(x[0])*r===64); if(j>=0) LS[key]=j;
}

function calcLoss(){
  const {P,fib,lc,lb}=points();
  document.querySelectorAll('#loss .val[data-p]').forEach(b=>{
    b.innerHTML=`${fmt(P[b.dataset.p])}${b.classList.contains('rx')?'':' <u>dBm</u>'}`;
    b.classList.toggle('anchor',b.dataset.p===LS.anchor);
  });
  document.getElementById('kmBtn').innerHTML=`${LS.km} <u>${L('km')}</u>`;
  document.getElementById('oFib').textContent='−'+fib.toFixed(2)+' dB';
  document.getElementById('oLc').textContent='−'+lc+' dB';
  document.getElementById('oLb').textContent='−'+lb+' dB';
  const mar=P.bout-THRESHOLD, ok=mar>=0;
  document.getElementById('oThr').textContent=fmt(THRESHOLD);
  document.getElementById('oCmp').textContent=ok?'≥':'<';
  document.getElementById('lres').className='lres '+(ok?'ok':'bad');
  document.getElementById('oSt').textContent=ok?`${L('ok')} · ${L('lmar')} ${fmt(mar)} dB`:`${L('bad')} · ${L('need')} ${Math.abs(mar).toFixed(1)} dB`;
  store.set('km',LS.km);store.set('spc3',LS.c);store.set('spb3',LS.b);store.set('anc',LS.anchor);store.set('aval',LS.aval);
}
/* клавиатура */
let padCb=null, padStr='';
const padV=document.getElementById('padV');
function openPad(title,val,unit,cb){padCb=cb;padStr=String(val).replace('−','-');document.getElementById('padT').textContent=title;
  document.getElementById('padU').textContent=unit;padV.textContent=padStr.replace('-','−');document.getElementById('pad').classList.remove('hide');padFresh=true}
let padFresh=true;
document.querySelectorAll('#pad .keys button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k||b.textContent;
  if(k==='cancel'){document.getElementById('pad').classList.add('hide');return}
  if(k==='ok'){const v=parseFloat(padStr);document.getElementById('pad').classList.add('hide');if(!isNaN(v))padCb(v);return}
  if(k==='bs'){padStr=padStr.slice(0,-1);padFresh=false}
  else if(k==='pm'){ if(padFresh){padStr='-';padFresh=false} else padStr=padStr.startsWith('-')?padStr.slice(1):'-'+padStr }
  else{ if(padFresh){padStr=padStr.startsWith('-')?'-':'';padFresh=false}
        if(k==='.'&&padStr.includes('.'))return; if(padStr.replace('-','').length>=6)return; padStr+=k}
  padV.textContent=padStr.replace('-','−')||'0';
});
document.addEventListener('keydown',e=>{
  const pad=document.getElementById('pad');
  if(!pad.classList.contains('hide')){
    const map={Enter:'ok',Escape:'cancel',Backspace:'bs','-':'pm','+':'pm',',':'.'};
    const k=map[e.key]||(/^[0-9.]$/.test(e.key)?e.key:null); if(!k) return;
    e.preventDefault();
    const btn=[...pad.querySelectorAll('.keys button')].find(b=>(b.dataset.k||b.textContent)===k); if(btn) btn.click();
    return;
  }
  if(hoverWheel&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();hoverWheel.step(e.key==='ArrowUp'?-1:1)}
});
document.getElementById('pad').addEventListener('click',e=>{if(e.target.id==='pad')e.currentTarget.classList.add('hide')});
const PNAME={olt:'olt',cin:'pCin',cout:'pCout',bout:'pBout'};
document.querySelectorAll('#loss .val[data-p]').forEach(b=>b.onclick=()=>{
  const p=b.dataset.p, {P}=points();
  const key=b.dataset.alias?'pBin':PNAME[p];
  openPad(key==='olt'?'OLT':L(key),P[p].toFixed(1),'dBm',v=>{LS.anchor=p;LS.aval=v;calcLoss()});
});
document.getElementById('kmBtn').onclick=()=>openPad(L('len'),LS.km,L('km'),v=>{LS.km=Math.max(0,Math.abs(v));calcLoss()});
renderChips();
if(SPL_BUILDING[LS.b]===undefined||ratio(SPL_CLOSURE[LS.c][0])*ratio(SPL_BUILDING[LS.b][0])!==64){autoPair('c');renderChips()}

/* ===== СТАРТ ===== */
let hoverWheel=null;
document.getElementById('numIn').onclick=()=>{
  const N=C.T*C.F;
  openPad(`№  (1–${N})`, S.t*C.F+S.f+1, '', v=>{
    const n=Math.min(N,Math.max(1,Math.round(Math.abs(v))))-1;
    wN.setValue(n); onNum(n);
  });
};
wT=new Wheel(document.getElementById('wT'),{count:C.T,item:itemTube,onChange:onTube});
wF=new Wheel(document.getElementById('wF'),{count:C.F,item:itemFiber,onChange:onFiber});
wN=new Wheel(document.getElementById('wN'),{count:C.T*C.F,item:itemNum,cls:'num',onChange:onNum});
[[wT,'wT'],[wF,'wF'],[wN,'wN']].forEach(([w,id])=>{const el=document.getElementById(id);el.addEventListener('mouseenter',()=>hoverWheel=w);el.addEventListener('mouseleave',()=>{if(hoverWheel===w)hoverWheel=null})});
applyTheme(); markTab('tbl');
setCable(C.id); applyLang();
function relayout(){layoutWheels();[wT,wF,wN].forEach(w=>w.refresh());fitText(document.querySelector('.title'));document.querySelectorAll('.res .ch>span:last-child').forEach(fitText)}
requestAnimationFrame(relayout);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(relayout);
if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',relayout);
[300,1000,2500].forEach(t=>setTimeout(relayout,t));
// пересчёт при любом изменении размера окна/рамки (в т.ч. внутри приложения Claude)
if(window.ResizeObserver){let rq=0;const ro=new ResizeObserver(()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(relayout)});
  ro.observe(document.querySelector('.wheels'));ro.observe(document.querySelector('.hdr'));}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)relayout()});
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}});
})}
</script>
